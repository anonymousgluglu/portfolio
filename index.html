<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio de Lucas Réal, étudiant BTS SIO SISR au lycée St Joseph du Havre. Systèmes, réseaux et cybersécurité." />
  <title>Portfolio — Lucas Réal</title>
  <style>
    :root {
      --bg: #1c1c1e;
      --bg-secondary: #2c2c2e;
      --text: #f0f0f2;
      --text-muted: #ffffff;
      --blue: #3b9eff;
      --border-light: #3a3a3c;
      --gray-bg: #252527;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { overflow-y: scroll; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ── SHADER CANVAS ── */
    #shader-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      height: 64px;
      background: rgba(28, 28, 30, 0.30);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: background 0.3s ease;
    }

    .nav-logo {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
    }
    .nav-logo span { color: var(--blue); }

    .nav-links { display: flex; gap: 30px; list-style: none; align-items: center; }
    .nav-links a {
      font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
      color: rgba(255,255,255,0.65); text-decoration: none; transition: color .2s;
      font-weight: 600;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--blue); }

    #darkToggle {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: #ffffff;
      padding: 5px 11px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: all 0.2s;
      margin-left: 10px;
      flex-shrink: 0;
    }
    #darkToggle:hover { border-color: var(--blue); }

    /* ── HERO ── */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px 120px;
    }

    .hero-greeting {
      font-size: 16px; color: var(--text-muted); letter-spacing: .02em;
      margin-bottom: 12px; opacity: 0;
      animation: fadeUp .6s ease forwards .15s;
    }
    .hero-name {
      font-size: clamp(52px, 9vw, 100px); font-weight: 700;
      line-height: 1; letter-spacing: -.03em; color: var(--text);
      opacity: 0; animation: fadeUp .6s ease forwards .3s;
    }
    .hero-firstname {
      display: inline-block; color: var(--blue);
      animation: bounce 1.1s cubic-bezier(.36,.07,.19,.97) both 1s;
    }
    .hero-line {
      width: 36px; height: 2px; background: var(--blue);
      margin: 20px auto; opacity: 0;
      animation: fadeUp .5s ease forwards .45s;
    }
    .hero-sub {
      font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 44px; line-height: 2;
      opacity: 0; animation: fadeUp .6s ease forwards .55s;
    }
    .hero-sub .dot {
      display: inline-block; width: 4px; height: 4px;
      background: var(--blue); border-radius: 50%;
      vertical-align: middle; margin: 0 12px; position: relative; top: -1px;
    }

    .btn-visit {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--text); color: var(--bg); font-size: 11px;
      font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      padding: 18px 40px; text-decoration: none; border-radius: 12px;
      transition: all 0.3s ease;
      opacity: 0; animation: fadeUp .6s ease forwards .7s;
    }
    .btn-visit:hover { background: var(--blue); color: #fff; transform: translateY(-3px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%   { transform: translateY(0); }
      20%  { transform: translateY(-20px); }
      40%  { transform: translateY(0); }
      56%  { transform: translateY(-10px); }
      70%  { transform: translateY(0); }
      82%  { transform: translateY(-5px); }
      90%  { transform: translateY(0); }
      100% { transform: translateY(0); }
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      background: rgba(28, 28, 30, 0.8);
      border-top: 1px solid var(--border-light);
      padding: 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .footer-copy { font-size: 11px; color: var(--text-muted); letter-spacing: .05em; }
    .footer-copy span { color: var(--blue); font-weight: 600; }

    @media (max-width: 850px) {
      nav { padding: 0 24px; }
      .nav-links { gap: 15px; }
      .nav-links a { font-size: 9px; }
    }
  </style>
</head>
<body>

<!-- SHADER CANVAS -->
<canvas id="shader-canvas"></canvas>

<nav>
  <a class="nav-logo" href="index.html">Lucas<span>.</span>Réal</a>
  <div style="display:flex; align-items:center; gap:30px;">
    <ul class="nav-links">
      <li><a href="index.html" class="active">Accueil</a></li>
      <li><a href="profil.html">Profil</a></li>

      <li><a href="missions.html">Missions</a></li>
      <li><a href="veille.html">Veille Technologique</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button id="darkToggle" title="Mode nuit">🌙</button>
  </div>
</nav>

<main class="hero">
  <p class="hero-greeting">Bonjour ! Je m'appelle</p>
  <h1 class="hero-name"><span class="hero-firstname">Lucas</span> REAL</h1>
  <div class="hero-line"></div>
  <p class="hero-sub">
    Étudiant en BTS SIO
    <span class="dot"></span>
    St Joseph
    <span class="dot"></span>
    Le Havre
  </p>
  <a class="btn-visit" href="profil.html">Visiter &rarr;</a>

<footer>
  <div class="footer-copy">&copy; 2026 Lucas Réal — Portfolio BTS SIO</div>

</footer>

<script>
  // ── DARK TOGGLE ──
  const toggle = document.getElementById('darkToggle');
  let dark = false;
  toggle.addEventListener('click', () => {
    dark = !dark;
    toggle.textContent = dark ? '☀️' : '🌙';
    // Sur l'accueil le fond est le shader, on peut juste basculer l'opacité du canvas
    document.getElementById('shader-canvas').style.opacity = dark ? '0.5' : '1';
  });

  // ── MESH GRADIENT SHADER EN WEBGL PUR ──
  (function() {
    const canvas = document.getElementById('shader-canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) return;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    const vs = `
      attribute vec2 a_position;
      void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
      }
    `;

    const fs = `
      precision mediump float;
      uniform float u_time;
      uniform vec2  u_resolution;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }
      float fbm(vec2 p) {
        float v = 0.0; float a = 0.5;
        for(int i = 0; i < 5; i++) {
          v += a * noise(p);
          p  = p * 2.1 + vec2(1.7, 9.2);
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / u_resolution;
        float t  = u_time * 0.12;
        vec2 q = vec2(fbm(uv + t), fbm(uv + vec2(1.0)));
        vec2 r = vec2(fbm(uv + 4.0*q + vec2(1.7, 9.2) + 0.15*t),
                      fbm(uv + 4.0*q + vec2(8.3, 2.8) + 0.126*t));
        float f = fbm(uv + 4.0*r);
        vec3 c1 = vec3(0.067, 0.067, 0.075);
        vec3 c2 = vec3(0.227, 0.227, 0.235);
        vec3 c3 = vec3(0.431, 0.431, 0.451);
        vec3 cBlue = vec3(0.231, 0.620, 1.0);
        vec3 color = mix(c1, c2, clamp(f * f * 4.0, 0.0, 1.0));
        color = mix(color, c3, clamp(length(q), 0.0, 1.0));
        color = mix(color, cBlue * 0.25, clamp(length(r.x), 0.0, 1.0) * 0.18);
        float vign = 1.0 - length((uv - 0.5) * 1.6);
        vign = clamp(vign, 0.0, 1.0);
        color *= 0.55 + 0.55 * vign;
        gl_FragColor = vec4(color, 1.0);
      }
    `;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

    const pos = gl.getAttribLocation(prog, 'a_position');
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes  = gl.getUniformLocation(prog, 'u_resolution');

    let start = performance.now();
    function render() {
      gl.uniform1f(uTime, (performance.now() - start) / 1000);
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }
    render();
  })();
</script>

</body>
